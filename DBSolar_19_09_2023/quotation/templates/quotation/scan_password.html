<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proposal Access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #0a2540;
    }
    p {
      margin: 0 0 18px;
      color: #555;
      line-height: 1.5;
    }
    .qid {
      font-weight: bold;
      color: #111;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #222;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccd3da;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-radius: 6px;
      background: #0a2540;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .error {
      margin-top: 14px;
      color: #b00020;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter Password</h1>
    <p>Quotation ID: <span class="qid">{{ qid }}</span></p>
    <p>Enter your password to view the Roof Top Solar Proposal PDF.</p>
    <form method="post">
      {% csrf_token %}
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="off" required>
      <button type="submit">View PDF</button>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
    </form>
  </div>
</body>
</html>
