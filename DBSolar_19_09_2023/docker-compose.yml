version: '3.8'

# Version 2 local/staging compose — separate DB from production V1
services:
  web:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://heramb:Heramb2023@db:5432/solar_db_v2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=solar_db_v2
      - DB_USER=heramb
      - DB_PASSWORD=Heramb2023
      - SECRET_KEY=change-me-for-v2-staging
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=solar_db_v2
      - POSTGRES_USER=heramb
      - POSTGRES_PASSWORD=Heramb2023
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
